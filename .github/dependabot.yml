version: 2

# تحديث آلي للتبعيات وأدوات اللينت.
# السبب: أدوات اللينت كانت مثبَّتة على إصدار واحد في CI بلا آلية ترقية، فينحرف
# الكود صامتاً عن الإصدار الحالي؛ ومكتبات المعالجة (torch/opencv/paddle) لها
# تاريخ ثغرات فك تشفير نشط بلا أي مراقبة.
# التحديثات مجمّعة شهريًا: PR واحد لكل مجموعة بدل PR لكل مكتبة، فلا تتراكم
# وتتقادم. المجموعات الخاصة أدناه تُطابَق أولًا، وما تبقّى يقع في المجموعتين
# العامتين (صغرى/تصحيحية، ورئيسية منفصلة لأنها وحدها قد تكسر البناء).
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    # منع الترقيات الرئيسية للمكتبات التي تكسر الكود فعلياً — CI لا يثبّتها
    # (غير موجودة في requirements-ci.lock) فيبقى أخضر مع PR يكسر التطبيق.
    # - PaddleOCR 3.x أزال use_angle_cls / use_gpu / show_log و cls= التي
    #   يستخدمها app/core/ocr.py، ويتطلّب PaddlePaddle 3.x.
    # - OpenCV 5 ترقية رئيسية غير مُختبَرة في مسار الفيديو.
    # الترقيات الصغرى والتصحيحية (وتنبيهات الأمان) تبقى مفعّلة.
    ignore:
      - dependency-name: paddleocr
        update-types: ["version-update:semver-major"]
      - dependency-name: "paddlepaddle*"
        update-types: ["version-update:semver-major"]
      - dependency-name: opencv-python
        update-types: ["version-update:semver-major"]
    groups:
      # ترقيات أدوات التطوير مجمّعة في PR واحد (منخفضة المخاطر)
      dev-tools:
        patterns:
          - black
          - ruff
          - mypy
          - "pytest*"
          - pip-audit
      # مكتبات الرؤية/التعلّم مجمّعة — ترقيتها تحتاج تحققاً يدوياً
      ml-stack:
        patterns:
          - torch
          - torchvision
          - ultralytics
          - opencv-python
          - "paddle*"
          - numpy
      # كل ما لم تلتقطه المجموعتان السابقتان
      minor-and-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      major:
        patterns: ["*"]
        update-types: ["major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    labels:
      - dependencies
    groups:
      github-actions:
        patterns: ["*"]
