name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Dependabot لا يحدّث متغيرات env هنا — عند دمج PR مجموعة dev-tools
  # حدّث هذه القيم يدوياً لتطابق requirements.txt، وإلا انحرف CI عن البيئة المحلية.
  RUFF_VERSION: "0.16.9"
  BLACK_VERSION: "26.5.1"
  MYPY_SPEC: "mypy>=2.3.1,<3"

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==${RUFF_VERSION}" "black==${BLACK_VERSION}"

      - name: Print versions
        run: |
          python --version
          ruff --version
          black --version

      - name: Run ruff
        run: ruff check app tests scripts

      - name: Check black formatting
        run: black --check app tests scripts

      # يفرض حدود حجم الملفات والدوالّ المُعلَنة في docs/architecture.md.
      # القاعدة كانت مُعلَنة في README بعلامة ✅ ومخروقة فعلياً.
      - name: Check structural limits
        run: python scripts/check_structure.py

  types:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-ci.lock
          pip install "${MYPY_SPEC}"

      # mypy كان مُعدّاً بـ strict=true في pyproject ولا يُشغَّل في أي مكان —
      # إعداد صرامة معطّل هو وهم أمان. يعمل الآن فعلياً على `app/`.
      - name: Run mypy
        run: mypy app

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install system libs (FFmpeg + Qt headless runtime)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libpulse0 libxkbcommon-x11-0

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      # التثبيت من الملف المقفول (بـhashes): بناء قابل لإعادة الإنتاج بالضبط
      # بدل «ما كان أحدث على PyPI يوم التشغيل».
      - name: Install CI dependencies (locked)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements-ci.lock

      # بوابة التغطية تمنع حذف الاختبارات دون أن يلاحظ أحد.
      # العتبة تعكس الواقع الحالي وتُرفع تدريجياً، لا رقماً طموحاً يُعطَّل لاحقاً.
      - name: Run pytest
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v --tb=short --cov=app --cov-report=term-missing --cov-fail-under=60

  security:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install "pip-audit>=2.10.1,<3"

      # الشجرة **نظيفة حالياً** (0 ثغرة معروفة). لا نُفشل البناء لأن ثغرة
      # جديدة قد تُنشَر في تبعية فرعية في أي يوم فتُحوّل CI أحمر لسبب لا علاقة
      # له بالـPR؛ Dependabot يفتح PR للترقية. النتيجة مرئية في كل تشغيل.
      - name: Audit dependencies
        continue-on-error: true
        run: |
          pip-audit -r requirements-ci.lock --desc
          pip-audit -r requirements-ci.txt --desc
