[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "baseer"
version = "0.1.0"
description = "نظام تحليل المخالفات المرورية من الفيديوهات — Local desktop application"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "TBD" }
authors = [
    { name = "Abdulkarim Al-Abboud" }
]
keywords = ["traffic", "violations", "computer-vision", "yolo", "arabic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.scripts]
baseer = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
exclude = ["tests*", "scripts*"]

# ============================================
# Black — تنسيق الكود
# ============================================
[tool.black]
line-length = 100
target-version = ["py310"]
include = '\.pyi?$'

# ============================================
# Ruff — التدقيق
# ============================================
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
]
ignore = [
    "E501",  # line too long — يتحكم به black
    "UP042", # StrEnum يحتاج Python 3.11 — نحتفظ بـ (str, Enum) للتوافق
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F401", "F811"]

# ============================================
# Mypy — التحقق من الأنواع
# ============================================
[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = [
    "ultralytics.*",
    "cv2.*",
    "paddleocr.*",
    "scenedetect.*",
    "ffmpeg.*",
    "imagehash.*",
    "pyqtgraph.*",
    "qtawesome.*",
    "qt_material.*",
    "arabic_reshaper.*",
    "bidi.*",
]
ignore_missing_imports = true

# ============================================
# Pytest
# ============================================
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
]
filterwarnings = [
    "ignore::DeprecationWarning",
]
